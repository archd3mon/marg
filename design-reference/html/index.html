<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marg — Pune Bus Planner · UI Design</title>
<link rel="stylesheet" href="marg.css">
</head>
<body>

<!-- ============ SVG sprite: icons, map, route, markers ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="sb" viewBox="0 0 66 12"><g fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="8" rx="1"/><rect x="15" y=".5" width="3" height="10.5" rx="1"/></g><path d="M25 4.2a8 8 0 0 1 11 0M27.2 6.6a5 5 0 0 1 6.6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="30.5" cy="9.4" r="1.4" fill="currentColor"/><rect x="42" y=".5" width="21" height="11" rx="3.4" fill="none" stroke="currentColor" opacity=".4"/><rect x="43.6" y="2.1" width="17" height="7.8" rx="2" fill="currentColor"/><rect x="64" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".4"/></symbol>

    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M3.5 11 20 4l-7 16.5-2.2-7.3z"/></symbol>
    <symbol id="i-bus" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="3.5"/><path d="M5 11h14M7.5 17.5V20M16.5 17.5V20"/><circle cx="8.8" cy="14.2" r=".7"/><circle cx="15.2" cy="14.2" r=".7"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.4" r="1.8"/><path d="M13 7.8 11 13.5l3.5 3.2.8 4.3M11 13.5 8.4 21M13 7.8l-4 2.2-.6 3.4M13 7.8l3.6 2.4 2 .4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3.4 2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 16.5v-5a6 6 0 0 0-12 0v5L4.5 18h15z"/><path d="M10 21h4"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4.2L6 21V4.5a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M9 7.5V5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-chevd" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
    <symbol id="i-chevl" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4v16M3.5 7.5 7 4l3.5 3.5M17 20V4M13.5 16.5 17 20l3.5-3.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21.5s7-6 7-11.5a7 7 0 1 0-14 0c0 5.5 7 11.5 7 11.5z"/><circle cx="12" cy="10" r="2.4"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2.5 5 13.5h6l-1 8 8.5-11h-6z"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.3"/><circle cx="18" cy="6" r="2.3"/><path d="M8.3 18H14a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-5h5.7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 14V3.5M8 7l4-4 4 4M6.5 10.5H5.5a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-8.5a1 1 0 0 0-1-1h-1"/></symbol>
    <symbol id="i-metro" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="4"/><path d="M5 11h14M9 20.5l1.5-3M15 20.5l-1.5-3"/><circle cx="8.8" cy="14.2" r=".7"/><circle cx="15.2" cy="14.2" r=".7"/></symbol>
    <symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 4v5a6 6 0 0 0 6 6h0a6 6 0 0 0 6-6V4M12 15v5M9 17.5l3 3 3-3"/></symbol>

    <!-- street patterns -->
    <pattern id="streets" width="34" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)"><path d="M0 14H34M17 0V28" stroke="#fff" stroke-width="2.2"/></pattern>
    <pattern id="streets2" width="120" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)"><path d="M0 50H120M60 0V100" stroke="#fff" stroke-width="4"/></pattern>

    <!-- shared road paths -->
    <path id="p-karve" d="M-30 560C40 530 90 505 135 481S220 436 252 420"/>
    <path id="p-fc" d="M252 420C262 385 272 352 286 336"/>
    <path id="p-nagar" d="M286 336S332 322 392 316L452 300S500 272 520 252S600 214 680 190"/>
    <path id="p-solapur" d="M392 440C470 480 540 560 680 615"/>
    <path id="p-station" d="M286 336C330 362 372 392 392 440"/>
    <path id="p-swargate" d="M392 440C372 500 342 540 330 570L350 940"/>
    <path id="p-univ" d="M286 336C250 300 200 290 130 270L20 250"/>
    <path id="p-paud" d="M135 481C100 430 70 380 10 320"/>
    <path id="p-sinh" d="M252 420C230 520 200 600 150 700"/>

    <!-- ===== MAP BASE (Apple-Maps-like, stylised Pune) ===== -->
    <g id="map-g">
      <rect x="-300" y="-300" width="1300" height="1500" fill="#F3F0E9"/>
      <rect x="-300" y="-300" width="1300" height="1500" fill="url(#streets)" opacity=".9"/>
      <rect x="-300" y="-300" width="1300" height="1500" fill="url(#streets2)" opacity=".8"/>
      <!-- parks -->
      <path d="M-60 130c60-60 160-70 215-25s35 120-30 148-150 8-185-123z" fill="#D2E7C2"/>
      <rect x="185" y="262" width="78" height="46" rx="16" fill="#D6EAC8"/>
      <ellipse cx="458" cy="395" rx="48" ry="24" fill="#D6EAC8"/>
      <rect x="360" y="522" width="70" height="58" rx="22" fill="#D6EAC8"/>
      <ellipse cx="395" cy="665" rx="58" ry="38" fill="#CFE5BE"/>
      <ellipse cx="150" cy="640" rx="70" ry="44" fill="#D2E7C2"/>
      <!-- rivers: Mutha, Mula, Mula-Mutha -->
      <g fill="none" stroke-linecap="round">
        <path d="M-60 640C40 600 120 575 190 510S280 480 320 420S360 345 372 322" stroke="#A9CCF0" stroke-width="17"/>
        <path d="M-60 640C40 600 120 575 190 510S280 480 320 420S360 345 372 322" stroke="#C3DFF8" stroke-width="10"/>
        <path d="M-60 190C70 200 180 215 270 250S350 295 372 322" stroke="#A9CCF0" stroke-width="15"/>
        <path d="M-60 190C70 200 180 215 270 250S350 295 372 322" stroke="#C3DFF8" stroke-width="8.5"/>
        <path d="M372 322C430 335 470 350 530 335S620 305 700 290" stroke="#A9CCF0" stroke-width="22"/>
        <path d="M372 322C430 335 470 350 530 335S620 305 700 290" stroke="#C3DFF8" stroke-width="14"/>
      </g>
      <!-- roads: arterials (white) then main (warm) -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#DAD4C4" stroke-width="8"><use href="#p-station"/><use href="#p-swargate"/><use href="#p-univ"/><use href="#p-paud"/><use href="#p-sinh"/></g>
        <g stroke="#FFFFFF" stroke-width="5"><use href="#p-station"/><use href="#p-swargate"/><use href="#p-univ"/><use href="#p-paud"/><use href="#p-sinh"/></g>
        <g stroke="#E6CB86" stroke-width="10.5"><use href="#p-karve"/><use href="#p-fc"/><use href="#p-nagar"/><use href="#p-solapur"/></g>
        <g stroke="#FCEBBE" stroke-width="7"><use href="#p-karve"/><use href="#p-fc"/><use href="#p-nagar"/><use href="#p-solapur"/></g>
      </g>
      <!-- labels -->
      <g fill="#8C887D" font-weight="600" text-anchor="middle" stroke="#F3F0E9" stroke-width="3" paint-order="stroke" style="font-size:calc(var(--fs,11)*1px);letter-spacing:.01em">
        <text x="62" y="470">Kothrud</text>
        <text x="236" y="404">Deccan</text>
        <text x="334" y="352">Shivajinagar</text>
        <text x="330" y="592">Swargate</text>
        <text x="424" y="462">Pune Station</text>
        <text x="476" y="414">Koregaon Park</text>
        <text x="418" y="288">Yerawada</text>
        <text x="500" y="276">Viman Nagar</text>
        <text x="110" y="168">Pashan</text>
        <text x="600" y="636">Hadapsar</text>
        <text x="220" y="288" fill="#7BA56B">Univ.</text>
      </g>
    </g>

    <!-- ===== ROUTE (bus 17 + bus 144) — width via --w ===== -->
    <g id="route-g" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 493L135 481S220 436 252 420C262 385 272 352 286 336S332 322 392 316L452 300S500 272 520 252" stroke="#fff" style="stroke-width:calc(var(--w,7)*1.6)"/>
      <path d="M110 493L135 481S220 436 252 420C262 385 272 352 286 336S332 322 392 316L452 300S500 272 520 252" stroke="#007AFF" style="stroke-width:var(--w,7)"/>
      <path d="M86 507L110 493M520 252L538 232" stroke="#fff" style="stroke-width:calc(var(--w,7)*1.4)"/>
      <path d="M86 507L110 493M520 252L538 232" stroke="#6E6E73" stroke-dasharray="0.1 9" style="stroke-width:calc(var(--w,7)*.75)"/>
    </g>
    <!-- markers (unit size, centred on 0,0) -->
    <g id="m-user"><circle r="24" fill="#007AFF" opacity=".16"/><circle r="9.5" fill="#fff"/><circle r="6.8" fill="#007AFF"/></g>
    <g id="m-stop"><circle r="7.5" fill="#fff" stroke="#007AFF" stroke-width="3"/></g>
    <g id="m-dest"><circle r="11" fill="#FF3B30" stroke="#fff" stroke-width="3.2"/><circle r="3.8" fill="#fff"/></g>
    <g id="m-node"><circle r="8" fill="#fff" stroke="#007AFF" stroke-width="3.6"/></g>
  </defs>
</svg>

<!-- ============ Gallery header ============ -->
<header class="hero">
  <div>
    <h1>Marg <span>·</span> मार्ग</h1>
    <p>Pune's buses, planned beautifully. v1 · PMPML bus network &nbsp;|&nbsp; Future scope · Pune Metro</p>
  </div>
  <div class="swatches">
    <div class="sw"><i style="background:#007AFF"></i>Blue<br>#007AFF</div>
    <div class="sw"><i style="background:#34C759"></i>Green<br>#34C759</div>
    <div class="sw"><i style="background:#FF9500"></i>Orange<br>#FF9500</div>
    <div class="sw"><i style="background:#FF3B30"></i>Red<br>#FF3B30</div>
    <div class="sw"><i style="background:#AF52DE"></i>Metro<br>#AF52DE</div>
    <div class="sw"><i style="background:#8E8E93"></i>Walk<br>#8E8E93</div>
    <div class="sw"><i style="background:#F2F2F7"></i>Canvas<br>#F2F2F7</div>
  </div>
</header>

<main class="grid">

<!-- ================= 01 WELCOME ================= -->
<figure class="item"><figcaption><b>01</b>Welcome<span>First-run onboarding · sets value + scope</span></figcaption>
<div class="device"><div class="phone" id="welcome">
  <div class="island"></div>
  <div class="statusbar"><span>9:41</span><svg><use href="#sb"/></svg></div>
  <div class="welcome">
    <div class="app-icon"><svg width="92" height="92" viewBox="0 0 92 92" fill="none"><path d="M28 66C28 42 64 52 64 27" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="28" cy="66" r="9" fill="#fff"/><circle cx="28" cy="66" r="3.6" fill="#0A63FF"/><circle cx="64" cy="27" r="9" fill="#fff"/></svg></div>
    <h1 class="t-large">Welcome to<br><span>Marg</span></h1>
    <p class="lede">Pune's buses, planned beautifully.</p>
    <div class="feat"><div class="tile blue"><svg class="ic"><use href="#i-route"/></svg></div><div><div class="t-head">Plan with confidence</div><div class="t-sub muted">Ranked routes with arrival times, transfers and walking at a glance.</div></div></div>
    <div class="feat"><div class="tile green"><svg class="ic"><use href="#i-clock"/></svg></div><div><div class="t-head">Know when it arrives</div><div class="t-sub muted">Live bus positions and calm alerts when something changes.</div></div></div>
    <div class="feat"><div class="tile orange"><svg class="ic"><use href="#i-pin"/></svg></div><div><div class="t-head">Made for Pune</div><div class="t-sub muted">Covers the PMPML bus network. Metro joins in a future update.</div></div></div>
    <div class="foot"><p class="t-cap">Location is used only to find stops near you.</p><div class="btn">Continue</div></div>
  </div>
  <div class="home-ind"></div>
</div></div></figure>

<!-- ================= 02 HOME ================= -->
<figure class="item"><figcaption><b>02</b>Home · Explore<span>Map-first, one clear action: “Where to?”</span></figcaption>
<div class="device"><div class="phone" id="home">
  <div class="island"></div>
  <svg class="map" viewBox="-20 250 300 649" preserveAspectRatio="xMidYMid slice" style="--fs:9;--w:6"><use href="#map-g"/>
    <use href="#m-stop" x="110" y="493"/><use href="#m-stop" x="168" y="533"/><use href="#m-stop" x="206" y="462"/>
    <g font-size="9" font-weight="600" fill="#2C2C2E" stroke="#fff" stroke-width="3" paint-order="stroke"><text x="122" y="509">Kothrud Depot</text><text x="180" y="549">Paud Phata</text><text x="218" y="478">Nal Stop</text></g>
    <use href="#m-user" x="86" y="507"/>
  </svg>
  <div class="statusbar"><span>8:42</span><svg><use href="#sb"/></svg></div>
  <div class="map-btns"><button><svg class="ic f"><use href="#i-arrow"/></svg></button><button><svg class="ic"><use href="#i-layers"/></svg></button></div>
  <div class="sheet home-sheet">
    <div class="grabber"></div>
    <div class="search" style="margin-top:14px"><svg class="ic"><use href="#i-search"/></svg>Where to?</div>
    <div class="shortcuts">
      <div class="shortcut"><div class="tile blue"><svg class="ic"><use href="#i-home"/></svg></div>Home</div>
      <div class="shortcut"><div class="tile orange"><svg class="ic"><use href="#i-bag"/></svg></div>Work</div>
      <div class="shortcut"><div class="tile gray" style="background:var(--fill);color:var(--blue)"><svg class="ic"><use href="#i-plus"/></svg></div>Add</div>
    </div>
    <div class="section-h" style="padding:0 4px"><b>Nearby stops</b><span class="link t-sub">See All</span></div>
    <div class="group" style="background:transparent">
      <div class="row stop-row"><div class="tile blue"><svg class="ic"><use href="#i-bus"/></svg></div><div class="grow"><div class="t-head">Kothrud Depot</div><div class="t-foot">120 m · Karve Road</div></div><div class="eta"><div style="display:flex;gap:4px"><span class="bus">17</span><span class="bus">144</span></div><span class="mins">4 min</span></div></div>
      <div class="row stop-row"><div class="tile blue"><svg class="ic"><use href="#i-bus"/></svg></div><div class="grow"><div class="t-head">Paud Phata</div><div class="t-foot">340 m · Paud Road</div></div><div class="eta"><div style="display:flex;gap:4px"><span class="bus">113</span></div><span class="mins">11 min</span></div></div>
    </div>
  </div>
  <div class="tabbar"><div class="tab on"><svg class="ic"><use href="#i-map"/></svg>Explore</div><div class="tab"><svg class="ic"><use href="#i-bookmark"/></svg>Saved</div><div class="tab"><svg class="ic"><use href="#i-bell"/></svg>Alerts</div></div>
  <div class="home-ind"></div>
</div></div></figure>

<!-- ================= 03 PLAN ================= -->
<figure class="item"><figcaption><b>03</b>Plan a trip<span>From · To · time · priority · Metro marked “Soon”</span></figcaption>
<div class="device"><div class="phone" id="plan">
  <div class="island"></div>
  <div class="statusbar"><span>8:42</span><svg><use href="#sb"/></svg></div>
  <div class="plan">
    <div class="navbar"><span class="link">Cancel</span><span class="title">Plan Trip</span><span></span></div>
    <div style="position:absolute;top:114px;left:0;right:0">
      <div class="od">
        <div class="dots"></div>
        <div class="field"><span class="pt from"></span><div class="grow"><div class="t-cap">From</div><div class="t-body" style="color:var(--blue)">Current Location</div></div></div>
        <div class="field"><svg class="ic f" style="color:var(--red);width:14px;height:14px;margin-left:-1px"><use href="#i-pin"/></svg><div class="grow"><div class="t-cap">To</div><div class="t-body">Viman Nagar</div></div></div>
        <div class="swap"><svg class="ic"><use href="#i-swap"/></svg></div>
      </div>
      <div class="block"><div class="group"><div class="row flush"><div class="tile t-blue"><svg class="ic"><use href="#i-clock"/></svg></div><div class="grow t-body">Leave</div><span class="muted t-body">Now · 8:42 AM</span><svg class="ic sm" style="color:var(--label-3)"><use href="#i-chev"/></svg></div></div></div>
      <div class="block" style="margin-top:20px"><div class="lbl">Travel by</div>
        <div class="seg"><div class="on"><svg class="ic sm"><use href="#i-bus"/></svg>Bus</div><div class="off"><svg class="ic sm"><use href="#i-metro"/></svg>Metro <span class="soon">Soon</span></div></div></div>
      <div class="block" style="margin-top:20px"><div class="lbl">Prioritise</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip on"><svg class="ic sm"><use href="#i-bolt"/></svg>Fastest</span><span class="chip">Fewer transfers</span><span class="chip">Less walking</span></div></div>
      <div class="block" style="margin-top:22px"><div class="lbl">Recent</div>
        <div class="group"><div class="row flush"><div class="tile gray" style="background:var(--fill);color:var(--label-2)"><svg class="ic"><use href="#i-clock"/></svg></div><div class="grow"><div class="t-body">Deccan Gymkhana</div><div class="t-foot">Pune</div></div></div>
        <div class="row flush"><div class="tile gray" style="background:var(--fill);color:var(--label-2)"><svg class="ic"><use href="#i-clock"/></svg></div><div class="grow"><div class="t-body">Pune Station</div><div class="t-foot">Pune</div></div></div></div></div>
    </div>
    <div class="cta"><div class="btn">Show Routes</div></div>
  </div>
  <div class="home-ind"></div>
</div></div></figure>

<!-- ================= 04 RESULTS ================= -->
<figure class="item"><figcaption><b>04</b>Route options<span>Ranked cards · badges explain the trade-off</span></figcaption>
<div class="device"><div class="phone" id="results">
  <div class="island"></div>
  <svg class="map" viewBox="20 60 620 1342" preserveAspectRatio="xMidYMid slice" style="--fs:17;--w:9"><use href="#map-g"/><use href="#route-g"/>
    <use href="#m-user" x="86" y="507" transform="translate(86 507) scale(1.4) translate(-86 -507)"/>
    <use href="#m-node" transform="translate(252 420) scale(1.5)"/>
    <use href="#m-dest" transform="translate(538 232) scale(1.6)"/>
  </svg>
  <div class="statusbar"><span>8:42</span><svg><use href="#sb"/></svg></div>
  <div class="floating-top"><div class="circle-btn"><svg class="ic lg"><use href="#i-chevl"/></svg></div><div class="od-pill">Current Location <svg class="ic sm" style="color:var(--label-2)"><use href="#i-chev"/></svg> Viman Nagar</div></div>
  <div class="sheet results-sheet">
    <div class="grabber"></div>
    <div class="res-head"><div><div class="t-title3">3 routes</div><div class="t-foot">PMPML buses · live schedule</div></div><span class="chip"><svg class="ic sm"><use href="#i-clock"/></svg>Leave now</span></div>

    <div class="card sel"><div class="top"><span class="badge green"><svg class="ic f"><use href="#i-bolt"/></svg>Fastest</span><div class="dur num">55<small> min</small></div></div>
      <div class="legs"><span class="walk"><svg class="ic"><use href="#i-walk"/></svg>6</span><svg class="ic sm sep-chev"><use href="#i-chev"/></svg><span class="bus"><svg class="ic"><use href="#i-bus"/></svg>17</span><svg class="ic sm sep-chev"><use href="#i-chev"/></svg><span class="bus"><svg class="ic"><use href="#i-bus"/></svg>144</span><svg class="ic sm sep-chev"><use href="#i-chev"/></svg><span class="walk"><svg class="ic"><use href="#i-walk"/></svg>3</span></div>
      <div class="meta"><span class="t-foot">Arrive 9:37 AM · 1 transfer</span><span class="t-foot" style="color:var(--green);font-weight:600">Next bus in 4 min</span></div></div>

    <div class="card"><div class="top"><span class="badge blue"><svg class="ic"><use href="#i-merge"/></svg>Fewer transfers</span><div class="dur num">63<small> min</small></div></div>
      <div class="legs"><span class="walk"><svg class="ic"><use href="#i-walk"/></svg>12</span><svg class="ic sm sep-chev"><use href="#i-chev"/></svg><span class="bus"><svg class="ic"><use href="#i-bus"/></svg>118</span><svg class="ic sm sep-chev"><use href="#i-chev"/></svg><span class="walk"><svg class="ic"><use href="#i-walk"/></svg>3</span></div>
