name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pump/backend/requirements-dev.txt }
      - run: pip install -r pump/backend/requirements-dev.txt
      - run: cd pump/backend && python -m pytest tests -q
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cd pump/mobile && flutter pub get && flutter analyze && flutter test
